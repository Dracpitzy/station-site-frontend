<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1559e6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ITV | Independent Television and Radio</title>

    <style>
      html, body { margin: 0; }

      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 50% at 20% 15%, rgba(90,151,255,.55), transparent 70%),
          radial-gradient(50% 45% at 85% 25%, rgba(47,120,255,.40), transparent 70%),
          radial-gradient(60% 55% at 50% 100%, rgba(194,219,255,.90), transparent 70%),
          #ffffff;
        transition: opacity .45s cubic-bezier(.22,1,.36,1),
                    transform .45s cubic-bezier(.22,1,.36,1),
                    visibility 0s .45s;
      }
      #splash.out {
        opacity: 0;
        transform: scale(1.04);
        visibility: hidden;
        pointer-events: none;
      }

      .sp-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      /* Glass orb */
      .sp-orb {
        position: relative;
        z-index: 1;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.30));
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,.8),
          inset 0 -1px 0 rgba(255,255,255,.2),
          0 20px 50px rgba(8,31,85,.18);
        animation: sp-pop .7s cubic-bezier(.22,1,.36,1) both;
      }

      /* Wordmark */
      .sp-word {
        display: flex;
        font: 800 38px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display",
              "Segoe UI", Roboto, Arial, sans-serif;
        letter-spacing: -.02em;
        color: #1559e6;
      }
      .sp-word i {
        font-style: normal;
        display: inline-block;
        opacity: 0;
        transform: translateY(14px);
        animation: sp-rise .55s cubic-bezier(.22,1,.36,1) forwards;
      }
      .sp-word i:nth-child(1) { animation-delay: .25s; }
      .sp-word i:nth-child(2) { animation-delay: .33s; }
      .sp-word i:nth-child(3) { animation-delay: .41s; }

      /* Broadcast rings */
      .sp-ring {
        position: absolute;
        top: 0;
        left: 50%;
        width: 132px;
        height: 132px;
        margin-left: -66px;
        border-radius: 50%;
        background: rgba(47,120,255,.20);
        opacity: 0;
        animation: sp-wave 1.6s ease-out infinite;
        animation-delay: .5s;
      }
      .sp-ring.r2 { animation-delay: 1s; }

      /* Tagline */
      .sp-tag {
        margin: 0;
        font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: #0f43b3;
        opacity: 0;
        animation: sp-fade .5s ease .6s forwards;
      }

      /* Progress bar */
      .sp-bar {
        width: 120px;
        height: 4px;
        border-radius: 4px;
        background: rgba(21,89,230,.15);
        overflow: hidden;
      }
      .sp-bar span {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #5a97ff, #1559e6);
        transform: scaleX(0);
        transform-origin: left;
        animation: sp-fill 1.2s cubic-bezier(.65,0,.35,1) .3s forwards;
      }

      @keyframes sp-pop  { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes sp-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes sp-wave { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.3); } }
      @keyframes sp-fade { to { opacity: .85; } }
      @keyframes sp-fill { to { transform: scaleX(1); } }

      @media (prefers-reduced-motion: reduce) {
        .sp-ring { display: none; }
        #splash, #splash.out { transition-duration: .01ms; }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Loading ITV">
      <div class="sp-stage">
        <div class="sp-ring"></div>
        <div class="sp-ring r2"></div>
        <div class="sp-orb">
          <span class="sp-word"><i>I</i><i>T</i><i>V</i></span>
        </div>
        <p class="sp-tag">Independent Television &amp; Radio</p>
        <div class="sp-bar"><span></span></div>
      </div>
    </div>

    <div id="root"></div>

    <!-- Safety net: if the app ever fails to load, the splash won't hang forever -->
    <script>
      setTimeout(function () {
        var s = document.getElementById("splash");
        if (s) s.classList.add("out");
      }, 3000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
